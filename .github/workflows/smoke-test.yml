name: Smoke test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build the scripts
        run: npm run build
      - name: Bundle size budget (gzipped)
        run: |
          js=$(gzip -c app/assets/js/app.js | wc -c); css=$(gzip -c app/assets/money.css | wc -c)
          echo "app.js $js bytes, money.css $css bytes (gzipped)"
          test "$js" -le 230000 || { echo "app.js grew past 230000 bytes gzipped: look at what was added"; exit 1; }
          test "$css" -le 60000 || { echo "money.css grew past 60000 bytes gzipped: look at what was added"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Start demo server
        run: python3 dev/mock_server.py &
      - run: sleep 2 && python3 dev/smoke_test.py
      - name: Start a slow, flaky demo server (1 in 10 reads fails with 502)
        run: LATENCY=0.1 FAIL_RATE=0.1 PORT=8766 python3 dev/mock_server.py &
      - name: Smoke test against the flaky server
        run: sleep 2 && BASE=http://127.0.0.1:8766/ python3 dev/smoke_test.py
