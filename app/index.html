<!doctype html>
<!-- Money: a modern frontend for Firefly III. MIT License: see LICENSE.
     Served by nginx from default.conf.template, which injects the Firefly token server-side. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="description" content="Money: a fast, private dashboard for Firefly III. Budgets, bills, forecasts and insights, in your browser or installed as an app.">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#22221f">
<meta name="money-version" content="${MONEY_VERSION}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/assets/js/boot.js?v=${MONEY_VERSION}"></script>
<link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/money.css?v=${MONEY_VERSION}">
</head>
<body>

<div id="login" class="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Money</h1>
    <p>Enter the dashboard password to continue.</p>
    <div id="loginErr" class="form-err" hidden></div>
    <input type="text" name="username" value="money" autocomplete="username" hidden>
    <label>Password<input type="password" id="loginPw" autocomplete="current-password" required autofocus></label>
    <label class="check"><input type="checkbox" id="loginRemember" checked> Keep me signed in on this computer</label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="login-foot"><a href="/privacy.html">Privacy</a></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span>Money</span><button type="button" class="side-tg" data-onclick="App.toggleSide()" title="Collapse the sidebar ([)" aria-label="Collapse the sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15M15.5 10l-2 2 2 2"/></svg></button></div>
    <span class="ff-slot"></span>
    <button type="button" class="side-search" data-onclick="App.openPalette()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search</span><kbd>⌘K</kbd></button>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="foot">
      <nav class="nav" id="navFoot"></nav>
      <div class="toggles">
        <button type="button" data-tg="privacy" data-onclick="App.togglePrivacy()"></button>
        <button type="button" class="side-tv-btn" data-onclick="App.toggleTvMode()" title="Toggle TV Mode">📺 TV Mode</button>
      </div>
      <a id="ffLink" href="${FIREFLY_URL}" target="_blank" rel="noopener">Open Firefly III ↗</a>
      <a id="fmLink" href="https://github.com/Muffy0906/firefly-money" target="_blank" rel="noopener">Original Firefly Money ↗</a>
      <button type="button" data-onclick="App.signOut()">Sign out</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<button id="fab" class="fab" type="button" data-onclick="App.quickAdd()" aria-label="Add transaction (N)" title="Add transaction (N)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="tabbar" class="tabbar" hidden></nav>
<button id="searchBtn" class="search-btn" type="button" data-onclick="App.openPalette()" aria-label="Search everything" title="Search everything (⌘K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
<div id="palette" class="palette" hidden data-onclick="App.palBackdrop(event,this)">
  <div class="palette-box" role="dialog" aria-label="Search everything"><div class="pal-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="palQ" type="search" enterkeyhint="go" placeholder="Search transactions, accounts, budgets, settings…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-controls="palList"
    data-oninput="App.palFilter()" data-onkeydown="App.palKey(event)"><button type="button" class="link pal-cancel" data-onclick="App.closePalette()">Cancel</button></div><div id="palList" class="pal-list" role="listbox"></div>
    <div class="pal-foot"><span>↑↓ to move</span><span>Enter to open</span><span>Esc to close</span></div></div>
</div>
<div id="undo" class="undo" role="status" aria-live="polite" hidden></div>
<div id="calpop" class="calpop" hidden></div>
<div id="pickpop" class="pickpop" hidden></div>
<div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
<div id="tip" class="tip" hidden></div>
<div id="scrim" class="scrim" data-onclick="App.closeDrawer()"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Details" aria-hidden="true" inert></aside>
<dialog id="confirm"></dialog>
<dialog id="whatsNew" class="whatsnew"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/app.js?v=${MONEY_VERSION}"></script>

</body>
</html>
